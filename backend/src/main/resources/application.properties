spring.application.name=vigentis

# Conexión a MySQL (la clave sale de la variable de entorno DB_PASSWORD, nunca va escrita aquí)
# En tu PC usa el MySQL local; en internet (Render) se toman DB_URL y DB_USER
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vigentis?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:vigentis_app}
spring.datasource.password=${DB_PASSWORD}

# Flyway crea y actualiza las tablas; JPA solo verifica que coincidan
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Archivos subidos (documentos y evidencias). Se guardan fuera del código.
vigentis.archivos.directorio=${ARCHIVOS_DIR:${user.home}/Documents/vigentis/archivos}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Sesiones (token JWT). La clave sale de la variable de entorno JWT_SECRET.
vigentis.jwt.secreto=${JWT_SECRET:}
vigentis.jwt.horas=8

# Multi-empresa: Hibernate filtra todos los datos por la empresa del usuario con sesión
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.vigentis.comun.ResolverEmpresa
